:root{

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 360px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:40}
h1{font:700 17px var(--body);margin:0 6px 0 0;letter-spacing:.01em;white-space:nowrap}
h1 span{font:400 11.5px var(--mono);color:var(--muted);margin-left:8px}
button,summary.btn{font:500 12.5px var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,summary.btn:hover{border-color:var(--accent)}

.search::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%);pointer-events:none}

details.pop{position:relative}
details.pop>summary{list-style:none;white-space:nowrap}

select{font:500 12.5px var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 6px}

.legend.themed+.hint{display:none}
.legend{position:absolute;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;font:11.5px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:min(560px,calc(100% - 24px));align-items:center}

.legend i{display:inline-block;width:14px;height:9px;border:1px solid rgba(0,0,0,.25);border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:absolute;z-index:6;pointer-events:none;background:var(--fg);color:var(--panel);font:500 12px var(--body);border-radius:6px;padding:5px 8px;max-width:260px;transform:translate(12px,14px);box-shadow:var(--shadow)}

.fx p{margin:6px 0 0}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

.crumbs button:hover{background:var(--accent);color:var(--panel)}
.crumbs .x{margin-left:auto;background:transparent;color:var(--muted);font:500 16px var(--body);padding:0 6px}
.st{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:1px 8px 1px 6px;white-space:nowrap}

.muted{color:var(--muted)}
.sec{margin-top:18px}

.dims dd.warn{color:#c0392b}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rows{list-style:none;margin:0;padding:0}

  if(m==='real'){legend.innerHTML=FLOWON?flowLegend():LEG0; dirty=true; return;}
  const T=THEMES[m], off=THOFF[m]||(THOFF[m]=new Set()), cnt={}, seen=new Set();
  [...PICKS,...FURG].forEach(o=>{const i=o.userData.info, k=i.key||i.n; if(o.isGroup&&Z4I[k]) return; if(o.userData.off||(o.isGroup&&!o.visible)) return;
    const tag=T.tag(o,k); if(tag==null) return;
    if(!seen.has(k)){seen.add(k); cnt[tag]=(cnt[tag]||0)+1;} if(off.has(tag)) return;
    let g,me; const mt=new THREE.MeshBasicMaterial({color:T.col(tag),transparent:true,opacity:0.46,depthWrite:false});
    if(o.material===pickMat){const p=o.geometry.parameters; g=new THREE.BoxGeometry(p.width+0.04,p.height+0.04,p.depth+0.04); me=new THREE.Mesh(g,mt); o.updateMatrixWorld(); me.applyMatrix4(o.matrixWorld);}
    else {const b=new THREE.Box3().setFromObject(o); if(b.isEmpty()) return; const s=b.getSize(new THREE.Vector3()); g=new THREE.BoxGeometry(s.x+0.04,s.y+0.04,s.z+0.04); me=new THREE.Mesh(g,mt); b.getCenter(me.position);}
    me.renderOrder=5; scene.add(me); THO.push(me);});
  const tags=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  legend.innerHTML=`<b>${T.title} · toca para filtrar</b>`+tags.map(([t,n])=>`<button data-tag="${esc(t)}" aria-pressed="${!off.has(t)}"><i style="background:${T.col(t)}"></i>${esc(T.name(t))} · ${n}</button>`).join('')+(off.size?`<button data-tag="*">Mostrar todo</button>`:tags.length>1?`<button data-tag="-">Ocultar todo</button>`:'')+(FLOWON?flowLegend():'');
  legend._tags=tags.map(t=>t[0]); dirty=true;}
legend.addEventListener('click',e=>{const b=e.target.closest('button[data-tag]'); if(!b||THEME==='real') return; const off=THOFF[THEME], t=b.dataset.tag;
  if(t==='*') off.clear(); else if(t==='-') (legend._tags||[]).forEach(x=>off.add(x)); else if(off.has(t)) off.delete(t); else off.add(t); setTheme(THEME);});
document.querySelectorAll('[data-theme-mode]').forEach(b=>b.addEventListener('click',()=>{ if(MOVE&&b.dataset.themeMode!=='real') return; setTheme(b.dataset.themeMode);}));
document.getElementById('t-fur').addEventListener('click',()=>{ if(THEME!=='real') setTheme(THEME);});
// ---------- flujos de tránsito (propuesta preliminar · franja de 0,80 m) ----------

const FLOWS=[
 {t:'p',n:'Pasillo central desde el acceso principal (puerta automática deslizable)',pts:[[65.1,13.5],[51.0,13.5],[51.0,12.15],[46.9,12.15]]},
 {t:'p',n:'Tránsito Z11 · Z9 · Z12',pts:[[58.3,13.5],[58.3,6.6]]},
 {t:'p',n:'Tránsito Z12 frente a staff',pts:[[55.6,6.6],[64.6,6.6]]},
 {t:'s',n:'Acceso a Z3 · taller de máquinas',pts:[[46.9,12.15],[45.45,12.15],[45.45,15.3],[44.45,15.3]],a:1},
 {t:'s',n:'Acceso a Z4 por el vano junto al macizo',pts:[[44.45,15.3],[44.45,20.1],[41.2,20.1]],a:1},

 {t:'s',n:'Acceso a Z10 comedor',pts:[[51.7,4.4],[49.9,4.4]],a:1},
 {t:'e',n:'Evacuación de Z3 por su salida de emergencia',pts:[[45.45,12.15],[45.45,7.7]],a:1}];
const FLCOL={p:'#1f6f9a',s:'#2e9e6b',e:'#d1495b'}, FLN={p:'Circulación principal',s:'Acceso a zonas',e:'Evacuación'};
let FLOWON=false; const FLG=new THREE.Group(); FLG.visible=false; scene.add(FLG);
(function(){const W=0.8, mats={}; const fm=t=>mats[t]||(mats[t]=new THREE.MeshBasicMaterial({color:FLCOL[t],transparent:true,opacity:0.42,depthWrite:false,side:THREE.DoubleSide})), am=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,depthWrite:false,side:THREE.DoubleSide});
  const tri=new THREE.Shape(); tri.moveTo(0.22,0); tri.lineTo(-0.14,0.2); tri.lineTo(-0.04,0); tri.lineTo(-0.14,-0.2); tri.closePath(); const tg=new THREE.ShapeGeometry(tri);
  FLOWS.forEach((f,fi)=>{let len=0; for(let i=0;i<f.pts.length-1;i++){const [a,b]=f.pts[i],[c,d]=f.pts[i+1], L=Math.hypot(c-a,d-b), ang=Math.atan2(d-b,c-a); len+=L;
      const m=new THREE.Mesh(new THREE.PlaneGeometry(L+(i<f.pts.length-2?W:0),W),fm(f.t)); m.rotation.set(-Math.PI/2,0,ang,'YXZ'); m.rotation.order='YXZ'; m.rotation.y=ang; m.rotation.x=-Math.PI/2; m.rotation.z=0;
      m.position.set((a+c)/2+(i<f.pts.length-2?Math.cos(ang)*W/2:0),0.02+fi*0.0004,-((b+d)/2+(i<f.pts.length-2?Math.sin(ang)*W/2:0))); m.renderOrder=3; FLG.add(m);
      const n=Math.max(1,Math.floor(L/1.6)); for(let k=0;k<n;k++){const s=(k+0.5)/n; [1,...(f.a?[]:[-1])].forEach(dir=>{const t=new THREE.Mesh(tg,am); t.rotation.order='YXZ'; t.rotation.y=ang+(dir<0?Math.PI:0); t.rotation.x=-Math.PI/2; const off=f.a?0:dir*0.18;
        t.position.set(a+(c-a)*s-Math.sin(ang)*off,0.03,-(b+(d-b)*s+Math.cos(ang)*off)); t.renderOrder=4; FLG.add(t);});}}
    f.len=len;});})();
[['Acceso principal · puerta automática',65900,13500,'#1f6f9a'],['Salida de emergencia Z3',45700,7000,'#d1495b']].forEach(([t,x,y,c])=>{label(t,x,1.2,y,0.0075,c); const sp=LABELS[LABELS.length-1]; FLG.add(sp);});
function flowLegend(){const L={}; FLOWS.forEach(f=>L[f.t]=(L[f.t]||0)+f.len); return `<b>Flujos de tránsito · propuesta, franja de 0,80 m</b>`+Object.keys(FLN).map(t=>`<span><i style="background:${FLCOL[t]}"></i>${FLN[t]} · ${String(Math.round(L[t])).replace('.',',')} m</span>`).join('');}

{const b=document.getElementById('t-flows'); if(b) b.addEventListener('click',()=>setFlows(!FLOWON));}

// loop
controls.target.set(CX-1.2,0,-CY-1.2); cam.zoom=1; controls.update(); resize(); r.shadowMap.needsUpdate=true; renderSide(null); fromHash();
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
(function loop(now){requestAnimationFrame(loop);
  if(anim){const t=anim.ms?Math.min(1,(now-anim.st)/anim.ms):1, k=ease(t); cam.position.lerpVectors(anim.p0,anim.p1,k); controls.target.lerpVectors(anim.t0,anim.t1,k); cam.zoom=anim.z0+(anim.z1-anim.z0)*k; cam.updateProjectionMatrix(); dirty=true; if(t>=1) anim=null;}
  if(controls.update()) dirty=true;
  if(box&&picked&&picked.material!==pickMat) box.update();
  if(dirty){onFrame(); r.render(scene,cam); dirty=false;}})(performance.now());
